<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线题库 · 选择练习</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #eef2ff;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --primary: #4f46e5;
    --primary-2: #7c3aed;
    --border: #e2e8f0;
    --shadow: 0 18px 45px rgba(15, 23, 42, .10);
  }
  html, body { min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
    color: var(--text);
    background:
      radial-gradient(900px 500px at 10% -10%, #e0e7ff, transparent 60%),
      radial-gradient(800px 460px at 100% 0%, rgba(124, 58, 237, .14), transparent 60%),
      var(--bg);
    line-height: 1.65;
    padding: 42px 18px 60px;
  }
  .wrap { max-width: 980px; margin: 0 auto; }
  .hero { text-align: center; margin-bottom: 30px; }
  .hero .badge {
    display: inline-block;
    font-size: 13px;
    color: var(--primary);
    background: #eef2ff;
    border: 1px solid #c7d2fe;
    border-radius: 999px;
    padding: 5px 14px;
    margin-bottom: 14px;
  }
  .hero h1 { font-size: clamp(28px, 5vw, 44px); letter-spacing: -.02em; }
  .hero h1 span {
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .hero p { color: var(--muted); margin-top: 10px; font-size: 15px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
    margin-top: 30px;
  }
  .card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 26px 24px;
    box-shadow: var(--shadow);
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 6px;
    background: linear-gradient(90deg, var(--primary), var(--primary-2));
  }
  .card.red::before { background: linear-gradient(90deg, #b71c1c, #ef5350); }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 24px 55px rgba(15, 23, 42, .16);
    border-color: #c7d2fe;
  }
  .card .icon {
    width: 52px;
    height: 52px;
    border-radius: 16px;
    display: grid;
    place-items: center;
    font-size: 26px;
    background: #eef2ff;
    margin-bottom: 16px;
  }
  .card.red .icon { background: #fbeaea; }
  .card h2 { font-size: 20px; margin-bottom: 6px; }
  .card .desc { color: var(--muted); font-size: 14px; min-height: 44px; }
  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 18px;
  }
  .pill {
    font-size: 12px;
    color: #4338ca;
    background: #eef2ff;
    border-radius: 999px;
    padding: 4px 10px;
  }
  .card.red .pill { color: #b71c1c; background: #fbeaea; }
  .go {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px dashed var(--border);
    font-weight: 700;
    color: var(--primary);
    font-size: 14px;
  }
  .card.red .go { color: #b71c1c; }
  .go span:last-child { font-size: 18px; }
  .footer {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-top: 34px;
  }
</style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <div class="badge">在线刷题 · 自动判分 · 进度保存在本机</div>
      <h1>选择你的<span>题库</span></h1>
      <p>点击下方卡片开始做题，无需登录，打开即用。</p>
    </section>

    <section class="grid">
      <a class="card" href="management.html">
        <div class="icon">📘</div>
        <h2>现代企业管理</h2>
        <div class="desc">章节练习、考试模式、错题回顾，支持按章节筛选和题目乱序。</div>
        <div class="meta">
          <span class="pill">104 题</span>
          <span class="pill">10 章</span>
          <span class="pill">单选 / 多选</span>
        </div>
        <div class="go"><span>开始做题</span><span>→</span></div>
      </a>

      <a class="card red" href="sizheng.html">
        <div class="icon">📕</div>
        <h2>思政选择题</h2>
        <div class="desc">顺序练习、模拟测试、错题重做，支持按单选、多选、判断筛选。</div>
        <div class="meta">
          <span class="pill">507 题</span>
          <span class="pill">单选 286</span>
          <span class="pill">多选 166</span>
          <span class="pill">判断 55</span>
        </div>
        <div class="go"><span>开始做题</span><span>→</span></div>
      </a>
    </section>

    <div class="footer">题库内容仅供学习练习使用 · 答题记录仅保存在当前浏览器</div>
  </main>
</body>
</html>
