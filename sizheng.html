<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>思政选择题 · 在线做题</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --primary: #c62828;
  --primary-light: #fbeaea;
  --green: #2e7d32;
  --green-bg: #e8f5e9;
  --red: #c62828;
  --red-bg: #fdecea;
  --gray: #9e9e9e;
  --gray-bg: #f5f5f5;
  --text: #263238;
  --text2: #607d8b;
  --border: #e0e0e0;
  --bg: #f0f2f5;
  --radius: 14px;
}
html, body { height: 100%; }
body {
  font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.65;
  padding-bottom: env(safe-area-inset-bottom);
}
#app { max-width: 760px; margin: 0 auto; padding: 16px 14px 100px; }

/* 顶栏 */
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: linear-gradient(135deg, #b71c1c, #d32f2f);
  color: #fff; border-radius: 0 0 18px 18px;
  padding: 14px 18px; margin: 0 -14px 16px;
  box-shadow: 0 4px 16px rgba(183,28,28,.35);
}
.topbar h1 { font-size: 18px; font-weight: 700; letter-spacing: 1px; }
.topbar .sub { font-size: 12px; opacity: .85; margin-top: 2px; }
.topbar .back {
  position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
  background: rgba(255,255,255,.18); color: #fff; border: none;
  padding: 7px 16px; border-radius: 20px; font-size: 13px; cursor: pointer;
}
.topbar .back:hover { background: rgba(255,255,255,.3); }

/* 首页 */
.hero {
  background: #fff; border-radius: var(--radius);
  padding: 28px 22px; text-align: center; margin-bottom: 14px;
  box-shadow: 0 2px 12px rgba(0,0,0,.06);
}
.hero .big { font-size: 24px; font-weight: 800; margin-bottom: 6px; }
.hero .big em { font-style: normal; color: var(--primary); }
.stat-row { display: flex; justify-content: center; gap: 26px; margin: 18px 0 6px; flex-wrap: wrap; }
.stat-row .st { min-width: 78px; }
.stat-row .st b { display: block; font-size: 22px; color: var(--primary); }
.stat-row .st span { font-size: 12px; color: var(--text2); }
.filter-box { background: #fff; border-radius: var(--radius); padding: 16px 18px; margin-bottom: 14px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
.filter-box .label { font-size: 13px; color: var(--text2); margin-bottom: 10px; }
.chips { display: flex; gap: 10px; flex-wrap: wrap; }
.chip {
  border: 1.5px solid var(--border); background: #fff; color: var(--text);
  border-radius: 22px; padding: 8px 18px; font-size: 14px; cursor: pointer; transition: all .15s;
  font-family: inherit;
}
.chip.on { border-color: var(--primary); background: var(--primary); color: #fff; }
.mode-list { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mode-card {
  background: #fff; border-radius: var(--radius); border: none; cursor: pointer;
  padding: 20px 16px; text-align: left; box-shadow: 0 2px 12px rgba(0,0,0,.06);
  transition: transform .12s, box-shadow .12s; position: relative; font-family: inherit;
}
.mode-card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.1); }
.mode-card .ic { font-size: 26px; }
.mode-card .t { font-size: 16px; font-weight: 700; margin: 6px 0 2px; }
.mode-card .d { font-size: 12px; color: var(--text2); }
.mode-card.full { grid-column: 1 / -1; }
.mode-card:disabled { opacity: .45; cursor: not-allowed; }
.mode-card:disabled:hover { transform: none; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
.mode-card .cnt { position: absolute; right: 14px; top: 16px; background: var(--primary-light); color: var(--primary); border-radius: 14px; font-size: 12px; padding: 2px 10px; font-weight: 700; }
.foot-tools { text-align: center; margin-top: 22px; }
.foot-tools button {
  background: none; border: none; color: var(--text2); font-size: 13px;
  cursor: pointer; padding: 8px 14px; text-decoration: underline; font-family: inherit;
}

/* 做题区 */
.progress-wrap { background: #fff; border-radius: var(--radius); padding: 12px 16px; margin-bottom: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
.progress-line { height: 8px; background: var(--gray-bg); border-radius: 4px; overflow: hidden; }
.progress-line i { display: block; height: 100%; background: linear-gradient(90deg, #d32f2f, #ef6292); border-radius: 4px; transition: width .3s; }
.progress-text { display: flex; justify-content: space-between; font-size: 12px; color: var(--text2); margin-top: 8px; flex-wrap: wrap; gap: 4px; }
.progress-text label { cursor: pointer; user-select: none; }

.qcard {
  background: #fff; border-radius: var(--radius); padding: 22px 20px;
  box-shadow: 0 2px 12px rgba(0,0,0,.06); margin-bottom: 12px;
  animation: fadeIn .25s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.qhead { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.qno { font-size: 13px; color: var(--text2); }
.badge { font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 10px; }
.badge.single { background: #e3f2fd; color: #1565c0; }
.badge.multi  { background: #fff3e0; color: #e65100; }
.badge.judge  { background: #ede7f6; color: #5e35b1; }
.qtext { font-size: 17px; font-weight: 600; margin-bottom: 18px; word-break: break-word; }

.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; align-items: flex-start; gap: 12px;
  border: 2px solid var(--border); border-radius: 12px;
  padding: 13px 16px; cursor: pointer; background: #fff;
  transition: border-color .12s, background .12s, transform .08s;
  font-size: 15px; text-align: left; width: 100%;
  font-family: inherit; line-height: 1.55; color: var(--text);
}
.opt:active { transform: scale(.99); }
.opt .key {
  flex: none; width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--gray-bg); color: var(--text2);
  font-weight: 700; font-size: 14px; margin-top: 1px;
}
.opt:not(.locked):hover { border-color: #bdbdbd; }
.opt.picked { border-color: var(--primary); background: var(--primary-light); }
.opt.picked .key { background: var(--primary); color: #fff; }
.opt.correct { border-color: var(--green); background: var(--green-bg); }
.opt.correct .key { background: var(--green); color: #fff; }
.opt.wrong { border-color: var(--red); background: var(--red-bg); }
.opt.wrong .key { background: var(--red); color: #fff; }
.opt.locked { cursor: default; }
.opt.tf { justify-content: center; font-size: 17px; font-weight: 700; padding: 16px; }
.opt.tf .key { margin: 0; }
.opts.two { flex-direction: row; }
.opts.two .opt { justify-content: center; }

.feedback { margin-top: 16px; border-radius: 12px; padding: 14px 16px; font-size: 14px; animation: fadeIn .2s ease; }
.feedback.ok { background: var(--green-bg); color: var(--green); }
.feedback.no { background: var(--red-bg); color: var(--red); }
.feedback b { font-size: 15px; }
.feedback .ans { margin-top: 4px; }
.feedback .note { margin-top: 8px; font-size: 12px; color: #b26a00; background: #fff8e1; border-radius: 8px; padding: 6px 10px; }

.multi-confirm {
  margin-top: 16px; width: 100%; border: none; border-radius: 12px;
  background: var(--primary); color: #fff; font-size: 16px; font-weight: 700;
  padding: 13px; cursor: pointer; box-shadow: 0 4px 12px rgba(198,40,40,.3);
  font-family: inherit;
}
.multi-confirm:disabled { background: var(--gray); box-shadow: none; cursor: not-allowed; }
.multi-tip { text-align: center; color: var(--text2); font-size: 12px; margin-top: 8px; }

/* 底部操作 */
.navbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 60;
  background: #fff; box-shadow: 0 -2px 16px rgba(0,0,0,.08);
  padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
}
.navbar .inner { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; align-items: stretch; }
.navbar button {
  flex: 1; border: none; border-radius: 12px; padding: 13px 0;
  font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit;
}
.btn-prev { background: var(--gray-bg); color: var(--text); flex: 0 0 100px !important; }
.btn-next { background: var(--primary); color: #fff; flex: 1.6 !important; }
.btn-mid { background: #fff; color: var(--text2); border: 1.5px solid var(--border) !important; flex: 0 0 92px !important; font-size: 13px !important; font-weight: 600 !important; }

/* 答题卡 */
.palette-mask {
  position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 70;
  display: none; align-items: flex-end;
}
.palette-mask.show { display: flex; }
.palette {
  background: #fff; width: 100%; max-width: 760px; margin: 0 auto;
  border-radius: 18px 18px 0 0; padding: 20px 18px 30px;
  max-height: 70vh; overflow-y: auto;
}
.palette h3 { font-size: 15px; margin-bottom: 4px; }
.palette .lgd { display: flex; gap: 14px; font-size: 12px; color: var(--text2); margin-bottom: 14px; flex-wrap: wrap; }
.lgd i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 4px; vertical-align: -1px; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 8px; }
.pcell {
  height: 42px; border-radius: 10px; border: 1.5px solid var(--border);
  background: #fff; font-size: 14px; font-weight: 700; cursor: pointer; color: var(--text);
  font-family: inherit;
}
.pcell.ok { background: var(--green-bg); border-color: #a5d6a7; color: var(--green); }
.pcell.no { background: var(--red-bg); border-color: #ef9a9a; color: var(--red); }
.pcell.done { background: #e3f2fd; border-color: #90caf9; color: #1565c0; }
.pcell.cur { outline: 3px solid #d32f2f; outline-offset: 1px; }

/* 成绩页 */
.result-hero {
  background: #fff; border-radius: var(--radius); padding: 34px 20px;
  text-align: center; margin-bottom: 14px; box-shadow: 0 2px 12px rgba(0,0,0,.06);
}
.score-ring {
  width: 150px; height: 150px; margin: 0 auto 14px; border-radius: 50%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: conic-gradient(var(--rc, #e53935) calc(var(--p, 0) * 1%), #eceff1 0);
  position: relative;
}
.score-ring::before {
  content: ""; position: absolute; inset: 11px; background: #fff; border-radius: 50%;
}
.score-ring .v { position: relative; font-size: 38px; font-weight: 800; color: var(--rc, #e53935); }
.score-ring .u { position: relative; font-size: 12px; color: var(--text2); }
.result-stats { display: flex; justify-content: center; gap: 30px; margin-top: 8px; flex-wrap: wrap; }
.result-stats .st b { display: block; font-size: 20px; }
.result-stats .st span { font-size: 12px; color: var(--text2); }
.result-stats .st.gb b { color: var(--green); }
.result-stats .st.rb b { color: var(--red); }

.review-list { display: flex; flex-direction: column; gap: 10px; }
.rv-item {
  background: #fff; border-radius: 12px; padding: 16px 18px;
  box-shadow: 0 1px 8px rgba(0,0,0,.05); border-left: 4px solid #ef9a9a;
}
.rv-item .rvq { font-size: 14px; font-weight: 600; margin-bottom: 8px; word-break: break-word; }
.rv-item .rvl { font-size: 13px; margin-top: 4px; }
.rv-item .ok { color: var(--green); font-weight: 600; }
.rv-item .no { color: var(--red); font-weight: 600; }
.rv-item .rv-opt { color: var(--text2); font-size: 13px; margin-top: 3px; white-space: pre-line; }

.empty { text-align: center; color: var(--text2); padding: 60px 20px; font-size: 14px; }
.empty .eic { font-size: 44px; margin-bottom: 10px; }

@media (max-width: 480px) {
  .mode-list { grid-template-columns: 1fr; }
  .qtext { font-size: 16px; }
  .opts.two { flex-direction: column; }
}
@media (min-width: 761px) { body { padding-bottom: 110px; } }
</style>
</head>

  const oldPal = document.getElementById("palMask");
  if (oldPal) oldPal.remove();
  if (mode === "home") renderHome();
  else if (mode === "test") renderTest();
  else if (mode === "result") renderResult();
  else renderPractice();
}
function goHome() { mode = "home"; render(); window.scrollTo(0, 0); }

/* ---------- 首页 ---------- */
function renderHome() {
  const cnt = { single: 0, multi: 0, judge: 0 };
  QUESTIONS.forEach(q => cnt[q.type]++);
  const answered = Object.keys(practiceStore).length;
  const wrongN = wrongSet.size;
  const fc = { all: QUESTIONS.length, ...cnt };
  const wrap = document.createElement("div");
  wrap.innerHTML = `
    <div class="topbar"><h1>思政选择题 · 在线做题</h1><div class="sub">共 ${QUESTIONS.length} 题 · 学习通题库</div></div>
    <div class="hero">
      <div class="big">共 <em>${QUESTIONS.length}</em> 道题，开始刷题吧！</div>
      <div class="stat-row">
        <div class="st"><b>${cnt.single}</b><span>单选题</span></div>
        <div class="st"><b>${cnt.multi}</b><span>多选题</span></div>
        <div class="st"><b>${cnt.judge}</b><span>判断题</span></div>
        <div class="st"><b>${answered}</b><span>已做过</span></div>
        <div class="st"><b>${wrongN}</b><span>待攻克错题</span></div>
      </div>
    </div>
    <div class="filter-box">
      <div class="label">题型范围（对练习和测试均生效）</div>
      <div class="chips" id="chips">
        <button class="chip ${filter === "all" ? "on" : ""}" data-f="all">全部 ${QUESTIONS.length} 题</button>
        <button class="chip ${filter === "single" ? "on" : ""}" data-f="single">单选 ${cnt.single}</button>
        <button class="chip ${filter === "multi" ? "on" : ""}" data-f="multi">多选 ${cnt.multi}</button>
        <button class="chip ${filter === "judge" ? "on" : ""}" data-f="judge">判断 ${cnt.judge}</button>
      </div>
    </div>
    <div class="mode-list">
      <button class="mode-card" id="mPractice">
        <span class="cnt">${fc[filter] || 0} 题</span>
        <span class="ic">📝</span>
        <div class="t">顺序练习</div>
        <div class="d">边做边看对错，自动保存进度${answered ? "（可继续上次）" : ""}</div>
      </button>
      <button class="mode-card" id="mRedo" ${wrongN ? "" : "disabled"}>
        <span class="cnt">${wrongN} 题</span>
        <span class="ic">🔁</span>
        <div class="t">错题重做</div>
        <div class="d">${wrongN ? "只做错过的题，答对即移出错题本" : "暂无错题，先去做题吧"}</div>
      </button>
      <button class="mode-card full" id="mTest">
        <span class="cnt">${fc[filter] || 0} 题</span>
        <span class="ic">🎯</span>
        <div class="t">模拟测试</div>
        <div class="d">随机打乱顺序，答完统一交卷评分，错题自动加入错题本</div>
      </button>
    </div>
    <div class="foot-tools">
      <button id="btnReset">清空做题记录与错题本</button>
    </div>`;
  app.appendChild(wrap);
  $("#chips").onclick = e => {
    const b = e.target.closest(".chip"); if (!b) return;
    filter = b.dataset.f; pref.filter = filter; saveLS(LS_PREF, pref); render();
  };
  $("#mPractice").onclick = () => { mode = "practice"; list = filtered(); idx = firstUnfinished(list); render(); };
  $("#mRedo").onclick = () => {
    if (!wrongSet.size) return;
    mode = "redo"; list = QUESTIONS.filter(q => wrongSet.has(q.no)); idx = 0; render();
  };
  $("#mTest").onclick = () => {
    mode = "test"; testOrder = shuffle(filtered().map(q => q.no));
    testSel = {}; testResult = null; idx = 0; render();
  };
  $("#btnReset").onclick = () => {
    if (!confirm("确定清空所有做题记录和错题本吗？")) return;
    Object.keys(practiceStore).forEach(k => delete practiceStore[k]);
    wrongSet.clear();
    savePractice(); saveWrong(); render();
  };
}
function firstUnfinished(l) {
  for (let i = 0; i < l.length; i++) if (!practiceStore[l[i].no]) return i;
  return 0;
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---------- 练习 / 错题重做 ---------- */
function renderPractice() {
  const q = list[idx];
  const isRedo = mode === "redo";
  const total = list.length;
  const answeredN = list.filter(x => practiceStore[x.no]).length;
  const correctN = list.filter(x => practiceStore[x.no] && practiceStore[x.no].ok).length;
  const rate = answeredN ? Math.round(correctN / answeredN * 100) : 0;

  const wrap = document.createElement("div");
  wrap.innerHTML = `
    <div class="topbar">
      <h1>${isRedo ? "错题重做" : "顺序练习"}</h1>
      <div class="sub">第 ${idx + 1} / ${total} 题 · 已答 ${answeredN} · 正确率 ${rate}%</div>
      <button class="back" id="btnHome">返回</button>
    </div>
    <div class="progress-wrap">
      <div class="progress-line"><i style="width:${(answeredN / total * 100).toFixed(1)}%"></i></div>
      <div class="progress-text">
        <span>题型：${TYPE_NAME[q.type]}${q.type === "multi" ? " · 可多选" : ""}</span>
        <label><input type="checkbox" id="autoNext" ${autoNext ? "checked" : ""}> 答对自动下一题</label>
      </div>
    </div>
    <div class="qcard" id="qcard"></div>`;
  app.appendChild(wrap);
  renderQuestion(q, userPick(q));
  buildNavbar({
    onNext: () => { if (idx < list.length - 1) { idx++; render(); } else goHome(); },
    nextLabel: idx === list.length - 1 ? "完成" : "下一题"
  });
  $("#autoNext").onchange = e => { autoNext = e.target.checked; pref.autoNext = autoNext; saveLS(LS_PREF, pref); };
  $("#btnHome").onclick = goHome;
}

function renderQuestion(q, rec) {
  const card = $("#qcard");
  const multi = q.type === "multi";
  const judge = q.type === "judge";
  const opts = judge ? ["对", "错"] : q.options;
  const picked = rec ? [...rec.pick] : [];
  const done = !!rec;
  const ansKeys = qKeys(q);

  card.innerHTML = `
    <div class="qhead">
      <span class="badge ${q.type}">${TYPE_NAME[q.type]}</span>
      <span class="qno">第 ${q.no} 题</span>
    </div>
    <div class="qtext">${esc(q.question)}</div>
    <div class="opts ${judge ? "two" : ""}" id="opts">
      ${opts.map(o => {
        const key = judge ? o : letterOf(o);
        let cls = "opt" + (judge ? " tf" : "");
        if (done) {
          cls += " locked";
          if (ansKeys.includes(key)) cls += " correct";
          else if (picked.includes(key)) cls += " wrong";
        } else if (picked.includes(key)) cls += " picked";
        const keyTxt = judge ? (key === "对" ? "✓" : "✗") : key;
        const body = judge ? key : o.replace(/^[A-E][\.、]\s*/, "");
        return `<button type="button" class="${cls}" data-key="${esc(key)}" ${done ? "disabled" : ""}>
          <span class="key">${esc(keyTxt)}</span><span>${esc(body)}</span></button>`;
      }).join("")}
    </div>
    ${multi && !done
      ? `<button type="button" class="multi-confirm" id="btnConfirm" disabled>确认答案</button>
         <div class="multi-tip">多选题：先点选所有你认为正确的选项，再点确认</div>` : ""}
    <div id="fbSlot"></div>`;

  if (done) { showFeedback(q, rec); return; }

  let sel = [];
  card.onclick = e => {
    const b = e.target.closest(".opt"); if (!b || b.disabled) return;
    const key = b.dataset.key;
    if (multi) {
      const i = sel.indexOf(key);
      if (i >= 0) sel.splice(i, 1); else sel.push(key);
      b.classList.toggle("picked", sel.includes(key));
      const c = $("#btnConfirm");
      c.disabled = sel.length === 0;
      c.textContent = sel.length ? `确认答案（已选 ${sel.length} 项）` : "确认答案";
    } else {
      submitPractice(q, [key]);
    }
  };
  const btnC = $("#btnConfirm");
  if (btnC) btnC.onclick = () => { if (sel.length) submitPractice(q, sel); };
}
function submitPractice(q, pick) {
  const r = answerKey(q, pick);
  const rec = { pick: [...pick], ok: r.ok };
  practiceStore[q.no] = rec;
  savePractice();
  if (r.ok) wrongSet.delete(q.no); else wrongSet.add(q.no);
  saveWrong();
  renderQuestion(q, rec);
  if (r.ok && autoNext && idx < list.length - 1) setTimeout(() => { idx++; render(); }, 650);
}
function showFeedback(q, rec) {
  const slot = $("#fbSlot");
  if (!slot) return;
  const r = answerKey(q, rec.pick);
  const ansTxt = q.type === "judge" ? q.answer : r.ans.split("").join("、");
  slot.innerHTML = `
    <div class="feedback ${r.ok ? "ok" : "no"}">
      <b>${r.ok ? "✔ 回答正确" : "✘ 回答错误"}</b>
      <div class="ans">正确答案：${esc(ansTxt)}</div>
      ${q.note ? `<div class="note">⚠ ${esc(q.note)}</div>` : ""}
    </div>`;
}

/* ---------- 底部导航 ---------- */
function buildNavbar(cfg) {
  const bar = document.createElement("div");
  bar.className = "navbar";
  bar.innerHTML = `<div class="inner">
    <button class="btn-prev" id="navPrev">上一题</button>
    <button class="btn-mid" id="navMid">答题卡</button>
    <button class="btn-next" id="navNext">${esc(cfg.nextLabel || "下一题")}</button>
  </div>`;
  app.appendChild(bar);
  $("#navPrev").onclick = () => { if (idx > 0) { idx--; render(); } };
  $("#navMid").onclick = showPalette;
  $("#navNext").onclick = cfg.onNext;
}
function showPalette() {
  const isTest = mode === "test";
  const state = i => {
    if (isTest) return (testSel[i] || []).length ? "done" : "";
    const rec = practiceStore[list[i].no];
    return rec ? (rec.ok ? "ok" : "no") : "";
  };
  const legend = isTest
    ? `<span><i style="background:#e3f2fd;border-color:#90caf9"></i>已作答</span><span><i style="background:#fff;border-color:#e0e0e0"></i>未作答</span><span><i style="outline:2px solid #d32f2f"></i>当前题</span>`
    : `<span><i style="background:var(--green-bg);border-color:#a5d6a7"></i>答对</span><span><i style="background:var(--red-bg);border-color:#ef9a9a"></i>答错</span><span><i style="background:#fff;border-color:#e0e0e0"></i>未答</span><span><i style="outline:2px solid #d32f2f"></i>当前题</span>`;
  const mask = document.createElement("div");
  mask.className = "palette-mask"; mask.id = "palMask";
  mask.innerHTML = `<div class="palette">
    <h3>答题卡（共 ${list.length} 题）</h3>
    <div class="lgd">${legend}</div>
    <div class="pgrid">
      ${list.map((qq, i) => `<button class="pcell ${state(i)} ${i === idx ? "cur" : ""}" data-i="${i}">${qq.no}</button>`).join("")}
    </div>
  </div>`;
  mask.onclick = e => { if (e.target === mask) mask.remove(); };
  mask.querySelector(".palette").onclick = e => {
    e.stopPropagation();
    const b = e.target.closest(".pcell"); if (!b) return;
    idx = +b.dataset.i; mask.remove(); render();
  };
  document.body.appendChild(mask);
  requestAnimationFrame(() => mask.classList.add("show"));
}

/* ---------- 模拟测试 ---------- */
function renderTest() {
  list = testOrder.map(byNo);
  const q = list[idx];
  const answeredN = Object.keys(testSel).length;
  const wrap = document.createElement("div");
  wrap.innerHTML = `
    <div class="topbar">
      <h1>模拟测试</h1>
      <div class="sub">已答 ${answeredN} / ${list.length} · 随机顺序</div>
      <button class="back" id="btnQuit">退出</button>
    </div>
    <div class="progress-wrap">
      <div class="progress-line"><i style="width:${(answeredN / list.length * 100).toFixed(1)}%"></i></div>
      <div class="progress-text"><span>题型：${TYPE_NAME[q.type]}${q.type === "multi" ? " · 可多选" : ""}</span><span>做完后点"交卷"查看成绩</span></div>
    </div>
    <div class="qcard" id="qcard"></div>
    <button class="multi-confirm" id="btnSubmit" style="background:#2e7d32;box-shadow:0 4px 12px rgba(46,125,50,.3)">交卷并查看成绩</button>`;
  app.appendChild(wrap);
  renderTestQuestion(q);
  buildNavbar({
    nextLabel: idx === list.length - 1 ? "回第一题" : "下一题",
    onNext: () => { idx = idx < list.length - 1 ? idx + 1 : 0; render(); }
  });
  $("#btnSubmit").onclick = submitTest;
  $("#btnQuit").onclick = () => {
    if (!confirm("退出将放弃本次测试作答，确定退出？")) return;
    mode = "home"; render();
  };
}
function renderTestQuestion(q) {
  const card = $("#qcard");
  const judge = q.type === "judge";
  const multi = q.type === "multi";
  const opts = judge ? ["对", "错"] : q.options;
  const sel = testSel[idx] || [];
  card.innerHTML = `
    <div class="qhead">
      <span class="badge ${q.type}">${TYPE_NAME[q.type]}</span>
      <span class="qno">第 ${idx + 1} / ${list.length} 题</span>
    </div>
    <div class="qtext">${esc(q.question)}</div>
    <div class="opts ${judge ? "two" : ""}" id="opts">
      ${opts.map(o => {
        const key = judge ? o : letterOf(o);
        const keyTxt = judge ? (key === "对" ? "✓" : "✗") : key;
        const body = judge ? key : o.replace(/^[A-E][\.、]\s*/, "");
        return `<button type="button" class="opt ${judge ? "tf" : ""} ${sel.includes(key) ? "picked" : ""}" data-key="${esc(key)}">
          <span class="key">${esc(keyTxt)}</span><span>${esc(body)}</span></button>`;
      }).join("")}
    </div>
    ${multi ? `<div class="multi-tip">多选题：选出所有你认为正确的选项</div>` : ""}`;
  card.onclick = e => {
    const b = e.target.closest(".opt"); if (!b) return;
    const key = b.dataset.key;
    let cur = testSel[idx] || [];
    if (multi) {
      cur = cur.includes(key) ? cur.filter(x => x !== key) : [...cur, key];
      testSel[idx] = cur;
      renderTestQuestion(q);
    } else {
      testSel[idx] = [key];
      renderTestQuestion(q);
      setTimeout(() => { if (idx < list.length - 1) { idx++; render(); } else render(); }, 150);
    }
  };
}
function submitTest() {
  const unanswered = list.length - Object.keys(testSel).length;
  if (unanswered > 0 && !confirm(`还有 ${unanswered} 题未作答，确定交卷？`)) return;
  let okN = 0;
  const wrongList = [];
  list.forEach((q, i) => {
    const pick = testSel[i] || [];
    const r = answerKey(q, pick);
    if (r.ok) okN++; else wrongList.push({ q, pick, r });
    practiceStore[q.no] = { pick: [...pick], ok: r.ok };
    if (r.ok) wrongSet.delete(q.no); else wrongSet.add(q.no);
  });
  savePractice(); saveWrong();
  const rate = list.length ? Math.round(okN / list.length * 100) : 0;
  testResult = { okN, total: list.length, rate, wrongList };
  mode = "result";
  render();
  window.scrollTo(0, 0);
}

/* ---------- 成绩页 ---------- */
function renderResult() {
  const r = testResult;
  const wrongN = r.total - r.okN;
  const wrap = document.createElement("div");
  wrap.innerHTML = `
    <div class="topbar"><h1>测试成绩</h1><div class="sub">共 ${r.total} 题</div></div>
    <div class="result-hero">
      <div class="score-ring" style="--p:${r.rate};--rc:${r.rate >= 60 ? "#2e7d32" : "#e53935"}">
        <span class="v">${r.rate}</span><span class="u">得分率 %</span>
      </div>
      <div class="result-stats">
        <div class="st gb"><b>${r.okN}</b><span>答对</span></div>
        <div class="st rb"><b>${wrongN}</b><span>答错</span></div>
        <div class="st"><b>${r.total}</b><span>总题数</span></div>
      </div>
    </div>
    <div class="review-list">
      ${r.wrongList.length === 0
        ? `<div class="empty"><div class="eic">🎉</div>全部答对，太棒了！</div>`
        : `<div class="empty" style="padding:14px;font-weight:700;color:var(--text)">以下 ${r.wrongList.length} 道错题已加入错题本</div>` +
          r.wrongList.map(w => `
          <div class="rv-item">
            <div class="rvq">${esc(w.q.question)}</div>
            ${w.q.options.length ? `<div class="rv-opt">${esc(w.q.options.join("\n"))}</div>` : ""}
            <div class="rvl">你的答案：<span class="no">${esc(w.pick.length ? w.pick.join("、") : "未作答")}</span></div>
            <div class="rvl">正确答案：<span class="ok">${esc(w.q.type === "judge" ? w.q.answer : w.r.ans)}</span></div>
            ${w.q.note ? `<div class="rvl" style="color:#b26a00">⚠ ${esc(w.q.note)}</div>` : ""}
          </div>`).join("")}
    </div>`;
  app.appendChild(wrap);
  const bar = document.createElement("div");
  bar.className = "navbar";
  bar.innerHTML = `<div class="inner">
    <button class="btn-prev" id="btnBackHome" style="flex:1">返回首页</button>
    <button class="btn-next" id="btnRedo" style="flex:1">重做错题（${wrongSet.size}）</button>
  </div>`;
  app.appendChild(bar);
  $("#btnBackHome").onclick = goHome;
  $("#btnRedo").onclick = () => {
    if (!wrongSet.size) { goHome(); return; }
    mode = "redo"; list = QUESTIONS.filter(q => wrongSet.has(q.no)); idx = 0; render();
  };
}

/* ---------- 键盘快捷键 ---------- */
document.addEventListener("keydown", e => {
  if (mode !== "practice" && mode !== "redo" && mode !== "test") return;
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
  const q = list[idx]; if (!q) return;
  if (e.key === "ArrowLeft") { if (idx > 0) { idx--; render(); } return; }
  if (e.key === "ArrowRight") { if (idx < list.length - 1) { idx++; render(); } return; }
  const k = e.key.toUpperCase();
  let key = null;
  if (q.type === "judge") {
    if (["1", "A", "T", "Y"].includes(k)) key = "对";
    else if (["2", "B", "F", "N"].includes(k)) key = "错";
  } else if (/^[A-E]$/.test(k)) key = k;
  if (key) {
    const b = document.querySelector(`#opts .opt[data-key="${key}"]`);
    if (b && !b.disabled) b.click();
  }
});

render();
</script>
</body>
</html>
